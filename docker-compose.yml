services:
  api:
    build: .
    restart: on-failure
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://database:27017/todos

  database:
    image: mongo:latest
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
